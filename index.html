<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>물리 실험 자기평가 루브릭</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#1c2230; --muted:#667085; --line:#e3e6eb;
  --pri:#2453c4; --pri-soft:#e9eefb; --pri-ink:#173a8f;
  --good:#16794f; --good-soft:#e5f4ec; --warn:#a95a07; --warn-soft:#fbf0e2; --bad:#b4332a; --bad-soft:#fbe9e7;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.hwrap{max-width:1040px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;margin-right:auto}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:10px}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
main{max-width:1040px;margin:0 auto;padding:20px 20px 60px}
#banner{max-width:1040px;margin:0 auto;padding:0 20px}
.note{margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:15.5px;margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;min-width:160px;flex:1}
.field label{font-size:13px;color:var(--muted);font-weight:500}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri-soft);border-color:var(--pri)}
textarea{min-height:80px;resize:vertical}
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:#f8f9fb}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.exp-card{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:#fff;display:flex;flex-direction:column;gap:8px}
.exp-card .meta{font-size:13px;color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;background:var(--bg);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.pri{background:var(--pri-soft);color:var(--pri-ink)}
.stepper{display:flex;gap:6px;margin:6px 0 18px;flex-wrap:wrap}
.stepper div{flex:1;min-width:110px;padding:8px 10px;border-radius:8px;background:#fff;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.stepper div b{display:block;font-size:12px;font-weight:500}
.stepper div.on{border-color:var(--pri);color:var(--pri-ink);background:var(--pri-soft)}
.stepper div.done{color:var(--good)}
.item{border-top:1px solid var(--line);padding:16px 0}
.item:first-child{border-top:0;padding-top:4px}
.item-h{margin-bottom:10px;font-weight:500}
.item-h .tag{display:inline-block;font-size:12px;font-weight:700;color:var(--pri-ink);background:var(--pri-soft);padding:1px 8px;border-radius:6px;margin-right:6px}
.item-h .prev{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:640px){.levels{grid-template-columns:1fr 1fr}}
.lv{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px;text-align:left;cursor:pointer;font-size:13px;line-height:1.45;color:var(--ink)}
.lv b{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.lv:hover{border-color:#b9c6e6}
.lv.sel{border-color:var(--pri);background:var(--pri-soft)}
.lv.sel b{color:var(--pri-ink)}
.navbar{display:flex;justify-content:space-between;gap:10px;margin-top:6px;align-items:center}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12.5px;color:var(--muted);font-weight:500;background:#fafbfc}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td input{padding:6px 8px}
.tablewrap{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25;margin-top:2px}
.kpi .s{font-size:12.5px;color:var(--muted)}
.chartbox{position:relative;height:320px}
.fb{padding:10px 14px;border-radius:10px;background:var(--bg);margin-bottom:8px;font-size:14px}
.fb.good{background:var(--good-soft)} .fb.warn{background:var(--warn-soft)} .fb.bad{background:var(--bad-soft)}
.subtabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.subtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.xrow{display:flex;gap:8px;margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw}
#toast.show{opacity:1}
#modal{position:fixed;inset:0;background:rgba(20,24,35,.4);display:none;align-items:center;justify-content:center;z-index:30;padding:20px}
#modal.show{display:flex}
#modal .box{background:#fff;border-radius:14px;padding:22px;max-width:420px;width:100%}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.loading{text-align:center;padding:60px;color:var(--muted)}
.wlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand">물리 실험 자기평가 루브릭<small>실험 전후 이해도 체크 · 오차 분석 · 메타인지</small></div>
    <div class="tabs" id="tabs"></div>
  </div>
</header>
<div id="banner"></div>
<main id="app"><div class="loading">불러오는 중…</div></main>
<div id="toast"></div>
<div id="modal"><div class="box" id="modalbox"></div></div>

<script>
/* ===================== 기본 데이터 ===================== */
const CORE = [
  {id:'concept', name:'개념 이해', q:'이 실험에 쓰이는 물리 법칙과 공식을 설명할 수 있다.',
   levels:['법칙이나 공식이 무엇인지 잘 모른다','공식은 알지만 의미를 설명하기 어렵다','공식의 의미와 각 변수를 설명할 수 있다','공식을 유도하고 적용 조건(가정)까지 설명할 수 있다']},
  {id:'design', name:'실험 설계', q:'실험 목적과 변인(독립·종속·통제 변인)을 구분할 수 있다.',
   levels:['실험 목적이 무엇인지 모호하다','목적은 알지만 변인을 구분하기 어렵다','목적과 주요 변인을 구분할 수 있다','변인 통제 방법까지 스스로 계획할 수 있다']},
  {id:'measure', name:'측정·장비', q:'장비를 올바르게 다루고 측정값을 정확하게 읽을 수 있다.',
   levels:['장비 사용법을 잘 모른다','안내를 받으면 측정할 수 있다','혼자 측정하고 단위·유효숫자를 지킬 수 있다','측정 과정의 오차를 줄이는 방법까지 적용할 수 있다']},
  {id:'data', name:'데이터 처리', q:'측정값을 표·그래프로 정리하고 필요한 값을 계산할 수 있다.',
   levels:['데이터를 어떻게 정리할지 모르겠다','표로 정리는 하지만 계산이 어렵다','표·그래프 정리와 평균 등 계산을 할 수 있다','그래프 기울기·추세선 등으로 물리량을 추출할 수 있다']},
  {id:'error', name:'오차 분석', q:'오차의 원인을 찾고 오차율과 불확도(표준편차 등)를 계산할 수 있다.',
   levels:['오차가 왜 생기는지 모르겠다','오차율 계산만 할 수 있다','오차율과 표준편차를 구하고 원인을 제시할 수 있다','계통·우연 오차를 구분하고 개선 방법을 제안할 수 있다']},
  {id:'conclusion', name:'결론·해석', q:'결과를 이론값과 비교해 의미를 설명하고 개선점을 제시할 수 있다.',
   levels:['결과가 무엇을 뜻하는지 설명하기 어렵다','이론값과 비교만 할 수 있다','차이의 원인을 근거와 함께 설명할 수 있다','결과의 한계와 후속 실험까지 제안할 수 있다']},
];
const GENERIC_LEVELS = ['전혀 할 수 없다','도움을 받으면 할 수 있다','대부분 혼자 할 수 있다','자신 있게 설명·수행할 수 있다'];
const LV_NAMES = ['1 미흡','2 기초','3 능숙','4 우수'];
const DEFAULT_CFG = {weights:{concept:1.5,design:1,measure:1,data:1,error:1.5,conclusion:1,_extra:1}, rubricRatio:70};
const LOCAL_SEED = [{id:'freefall', order:1, name:'자유낙하 실험', desc:'공을 일정 높이에서 떨어뜨려 낙하 시간을 측정하고 중력가속도 g를 구한다.',
  quantity:'중력가속도 g', unit:'m/s²', theory:9.8, tol:5, inputMode:'ht',
  extras:[{id:'x1',q:'h = ½gt² 관계를 이용해 측정값으로 g를 구하는 과정을 설명할 수 있다.'},{id:'x2',q:'공기 저항과 반응 시간(타이밍 오차)이 결과에 주는 영향을 설명할 수 있다.'}]}];
const TCRIT = [12.706,4.303,3.182,2.776,2.571,2.447,2.365,2.306,2.262,2.228,2.201,2.179,2.160,2.145,2.131,2.120,2.110,2.101,2.093,2.086,2.080,2.074,2.069,2.064,2.060,2.056,2.052,2.048,2.045,2.042];

/* ===================== 유틸 ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o ?? null));
const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : null; };
const fmt = (n, d=2) => (n==null || !Number.isFinite(n)) ? '–' : n.toFixed(d);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rid = p => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2600); }
function withTimeout(p, ms=10000){ return Promise.race([p, sleep(ms).then(()=>{ throw {code:'timeout', message:'응답 시간 초과'}; })]); }
async function safe(fn){ try { return await fn(); } catch(e){ return null; } }
function askConfirm(msg, okText='삭제'){
  return new Promise(res=>{
    $('#modalbox').innerHTML = `<h3>확인</h3><p>${esc(msg)}</p><div class="navbar"><span></span><div class="row"><button class="btn" id="mNo">취소</button><button class="btn pri" id="mYes">${esc(okText)}</button></div></div>`;
    $('#modal').classList.add('show');
    const done = v => { $('#modal').classList.remove('show'); res(v); };
    $('#mNo').onclick = () => done(false); $('#mYes').onclick = () => done(true);
  });
}
function mergeCfg(c){ const d=clone(DEFAULT_CFG); if(c){ Object.assign(d.weights, c.weights||{}); if(Number.isFinite(c.rubricRatio)) d.rubricRatio=c.rubricRatio; } return d; }
function errMsg(e){
  if(e && e.code==='invalid_argument') return '저장 권한이 없어요. 교수자에게 이 페이지의 참여(Contributor) 권한을 요청하세요.';
  if(e && e.code==='timeout') return '서버 응답이 늦어요. 잠시 후 다시 시도해 주세요.';
  if(e && e.code==='quota_exceeded') return '저장 공간이 가득 찼어요. 교수자에게 알려 주세요.';
  return '저장하지 못했어요. 잠시 후 다시 시도해 주세요.';
}

/* ===================== 상태 ===================== */
const S = { mode:'loading', uid:null, isAdmin:false, isOwner:false, cfg:mergeCfg(null), exps:[], my:null, resps:[],
  view:'student', expId:null, ptab:'analysis', pexp:null, edit:null, saving:false };
const charts = {};
function killChart(k){ if(charts[k]){ charts[k].destroy(); delete charts[k]; } }

/* ===================== 저장소 (db 또는 로컬 미리보기) ===================== */
const Local = {
  key:'physics-rubric-day3', mem:null,
  load(){ if(this.mem) return this.mem; let o=null; try{ o=JSON.parse(localStorage.getItem(this.key)); }catch(e){} this.mem=o||{}; return this.mem; },
  save(){ try{ localStorage.setItem(this.key, JSON.stringify(this.mem)); }catch(e){} }
};
const queues = {};
function enqueue(path, fn){ const p=(queues[path]||Promise.resolve()).catch(()=>{}).then(fn); queues[path]=p; return p; }
async function getCap(name){
  if(!window.claude || typeof window.claude.use!=='function') return null;
  try { return await Promise.race([window.claude.use(name), sleep(10000).then(()=>null)]); } catch(e){ return null; }
}
const API = {
  db:null, user:null,
  async init(){
    const [db, user] = await Promise.all([getCap('db'), getCap('user')]);
    if(db && user){
      const id = await safe(()=>user.id());
      if(id){
        this.db=db; this.user=user; S.uid=id; S.mode='db';
        S.isOwner = !!(await safe(()=>user.isOwner()));
        S.isAdmin = S.isOwner || !!(await safe(()=>user.canEdit()));
        return;
      }
    }
    S.mode='local'; S.uid='local-me'; S.isAdmin=true; S.isOwner=true;
  },
  async loadAll(){
    if(S.mode==='db'){
      const [c,e,m] = await Promise.all([
        withTimeout(this.db.doc('config/main').get()),
        withTimeout(this.db.collection('experiments').get()),
        withTimeout(this.db.doc('responses/'+S.uid).get())]);
      S.cfg = mergeCfg(c.exists ? c.data() : null);
      S.exps = e.docs.map(d=>({id:d.id, ...clone(d.data())}));
      S.my = m.exists ? clone(m.data()) : null;
      if(S.isAdmin) await this.loadResponses();
    } else {
      const L = Local.load();
      if(!L.exps){ L.exps = clone(LOCAL_SEED); Local.save(); }
      S.cfg = mergeCfg(L.cfg); S.exps = clone(L.exps);
      S.my = clone((L.resps||{})[S.uid] || null);
      await this.loadResponses();
    }
    S.exps.forEach(normExp);
    S.exps.sort((a,b)=>(a.order||0)-(b.order||0) || String(a.name).localeCompare(String(b.name)));
  },
  async loadResponses(){
    if(S.mode==='db'){
      const q = await withTimeout(this.db.collection('responses').get());
      S.resps = q.docs.map(d=>({id:d.id, ...clone(d.data())}));
    } else {
      const L = Local.load(); S.resps = Object.entries(L.resps||{}).map(([id,d])=>({id, ...clone(d)}));
    }
  },
  async saveConfig(cfg){
    if(S.mode==='db') return enqueue('config/main', ()=>withTimeout(this.db.doc('config/main').set(clone(cfg))));
    Local.load().cfg = clone(cfg); Local.save();
  },
  async saveExp(exp){
    const body = clone(exp); delete body.id;
    if(S.mode==='db') return enqueue('experiments/'+exp.id, ()=>withTimeout(this.db.doc('experiments/'+exp.id).set(body)));
    const L=Local.load(); const i=L.exps.findIndex(x=>x.id===exp.id); if(i>=0) L.exps[i]=clone(exp); else L.exps.push(clone(exp)); Local.save();
  },
  async delExp(id){
    if(S.mode==='db') return enqueue('experiments/'+id, ()=>withTimeout(this.db.doc('experiments/'+id).delete()));
    const L=Local.load(); L.exps=L.exps.filter(x=>x.id!==id); Local.save();
  },
  async saveResp(id, doc){
    if(S.mode==='db') return enqueue('responses/'+id, ()=>withTimeout(this.db.doc('responses/'+id).set(clone(doc))));
    const L=Local.load(); L.resps=L.resps||{}; L.resps[id]=clone(doc); Local.save();
  },
  async delResp(id){
    if(S.mode==='db') return enqueue('responses/'+id, ()=>withTimeout(this.db.doc('responses/'+id).delete()));
    const L=Local.load(); if(L.resps) delete L.resps[id]; Local.save();
  }
};
function normExp(e){
  e.extras = Array.isArray(e.extras) ? e.extras.filter(x=>x && x.id) : [];
  e.theory = num(e.theory); e.tol = num(e.tol) || 5;
  e.inputMode = e.inputMode==='ht' ? 'ht' : 'value';
  return e;
}

/* ===================== 계산 ===================== */
function rowsToValues(exp, m){
  if(!m) return [];
  if(exp.inputMode==='ht'){
    const H=m.h||[], T=m.t||[], out=[];
    for(let i=0;i<Math.max(H.length,T.length);i++){ const h=num(H[i]), t=num(T[i]); if(h>0 && t>0) out.push(2*h/(t*t)); }
    return out;
  }
  return (m.values||[]).map(num).filter(v=>v!=null);
}
function stats(vals, theory){
  const n=vals.length; if(!n) return {n:0};
  const mean=vals.reduce((a,b)=>a+b,0)/n;
  const sd = n>1 ? Math.sqrt(vals.reduce((a,b)=>a+(b-mean)**2,0)/(n-1)) : null;
  const se = sd!=null ? sd/Math.sqrt(n) : null;
  const tc = n>1 ? (TCRIT[n-2] || 1.96) : null;
  const ci = se!=null ? [mean-tc*se, mean+tc*se] : null;
  const relErr = theory ? Math.abs(mean-theory)/Math.abs(theory)*100 : null;
  const inCI = ci && theory!=null ? (theory>=ci[0] && theory<=ci[1]) : null;
  const cv = sd!=null && mean ? sd/Math.abs(mean)*100 : null;
  return {n, mean, sd, se, ci, relErr, inCI, cv};
}
function accScore(relErr, tol){
  if(relErr==null) return null;
  if(relErr <= tol*0.4) return 4; if(relErr <= tol) return 3; if(relErr <= tol*2) return 2; return 1;
}
function dims(exp){
  const d = CORE.map(c=>({id:c.id, name:c.name}));
  if(exp.extras.length) d.push({id:'_extra', name:'실험 특화'});
  return d;
}
function dimScores(exp, part){
  if(!part) return {};
  const out = {};
  CORE.forEach(c=>{ const v=num(part.scores && part.scores[c.id]); if(v) out[c.id]=v; });
  if(exp.extras.length){
    const xs = exp.extras.map(x=>num(part.extras && part.extras[x.id])).filter(v=>v);
    if(xs.length) out._extra = xs.reduce((a,b)=>a+b,0)/xs.length;
  }
  return out;
}
function weighted(exp, ds, cfg){
  let sw=0, s=0;
  dims(exp).forEach(d=>{ const w=num(cfg.weights[d.id]) ?? 1; if(ds[d.id]!=null && w>0){ sw+=w; s+=w*(ds[d.id]-1)/3; } });
  return sw ? s/sw*100 : null;
}
function analyze(exp, rec, cfg){
  const pre = dimScores(exp, rec && rec.pre), post = dimScores(exp, rec && rec.post);
  const preTotal = weighted(exp, pre, cfg), postTotal = weighted(exp, post, cfg);
  const st = stats(rowsToValues(exp, rec && rec.measure), exp.theory);
  const actual = accScore(st.relErr, exp.tol);
  const skillIds = ['measure','data','error'];
  const sv = skillIds.map(k=>post[k]).filter(v=>v!=null);
  const selfSkill = sv.length ? sv.reduce((a,b)=>a+b,0)/sv.length : null;
  const gap = (selfSkill!=null && actual!=null) ? selfSkill-actual : null;
  const calib = gap==null ? null : gap>=1 ? 'over' : gap<=-1 ? 'under' : 'ok';
  const pred = num(rec && rec.pre && rec.pre.predErr);
  const predGap = (pred!=null && st.relErr!=null) ? st.relErr - pred : null;
  const accPct = actual!=null ? (actual-1)/3*100 : null;
  const r = (num(cfg.rubricRatio) ?? 70)/100;
  const composite = (postTotal!=null && accPct!=null) ? r*postTotal + (1-r)*accPct : null;
  return {pre, post, preTotal, postTotal, growth:(preTotal!=null&&postTotal!=null)?postTotal-preTotal:null, st, actual, selfSkill, gap, calib, pred, predGap, composite};
}
const CALIB = {over:['과대평가 경향','bad'], under:['과소평가 경향','warn'], ok:['보정 양호','good']};

function ensureMy(){ if(!S.my) S.my={name:'', sid:'', exps:{}}; if(!S.my.exps) S.my.exps={}; return S.my; }
function rec(expId){
  const my=ensureMy();
  if(!my.exps[expId]) my.exps[expId] = {step:1, done:false, pre:{scores:{},extras:{},predErr:''}, measure:{values:['','',''],h:['','',''],t:['','','']}, post:{scores:{},extras:{},reflection:''}};
  const r=my.exps[expId];
  r.pre=r.pre||{scores:{},extras:{}}; r.pre.scores=r.pre.scores||{}; r.pre.extras=r.pre.extras||{};
  r.post=r.post||{scores:{},extras:{}}; r.post.scores=r.post.scores||{}; r.post.extras=r.post.extras||{};
  r.measure=r.measure||{values:[''],h:[''],t:['']};
  ['values','h','t'].forEach(k=>{ if(!Array.isArray(r.measure[k])||!r.measure[k].length) r.measure[k]=['']; });
  return r;
}

}

const STEPS = ['사전 자기평가','측정 결과 입력','사후 자기평가','결과 분석'];

function flowHTML(){

  const r=rec(exp.id), step=r.step||1;
  const stepper = `<div class="stepper">${STEPS.map((s,i)=>`<div class="${i+1===step?'on':(i+1<step||r.done)?'done':''}"><b>${i+1}단계</b>${s}</div>`).join('')}</div>`;
  let body='';
  if(step===1) body = rubricHTML(exp,'pre') + `<div class="card"><h3>오차율 예측</h3><p class="small muted" style="margin-top:0">실험하기 전에, 내 측정값이 이론값과 몇 % 정도 차이 날지 예상해 보세요. 실험 후 실제 오차율과 비교해요.</p>
      <div class="row"><div class="field" style="max-width:220px"><label>예상 오차율 (%)</label><input type="number" min="0" step="0.1" data-f="predErr" value="${esc(r.pre.predErr??'')}" placeholder="예: 5"></div></div></div>`;
  if(step===2) body = measureHTML(exp, r);
  if(step===3) body = rubricHTML(exp,'post') + `<div class="card"><h3>성찰 메모 (선택)</h3><textarea data-f="reflection" placeholder="실험하면서 새로 알게 된 점, 어려웠던 점, 다음에 바꿔 볼 점">${esc(r.post.reflection||'')}</textarea></div>`;
  if(step===4) body = resultHTML(exp, r);
  const nextLabel = step===3 ? '제출하고 결과 보기' : step===4 ? '' : '다음';
  return `<div class="row" style="justify-content:space-between;align-items:center;margin-bottom:6px"><div><button class="btn sm" data-act="home">← 실험 목록</button></div><span class="muted small">${esc(S.my&&S.my.name||'')} ${esc(S.my&&S.my.sid||'')}</span></div>
    <h1>${esc(exp.name)}</h1><p class="muted" style="margin:0 0 8px">${esc(exp.desc||'')}</p>${stepper}${body}
    <div class="navbar"><div>${step>1?`<button class="btn" data-act="step" data-d="-1">이전</button>`:''}</div>
    <div class="row" style="align-items:center"><span class="small muted" id="progress"></span>${nextLabel?`<button class="btn pri" data-act="step" data-d="1">${nextLabel}</button>`:''}</div></div>`;
}
function rubricItems(exp){
  return CORE.map(c=>({key:'scores', id:c.id, name:c.name, q:c.q, levels:c.levels}))
    .concat(exp.extras.map((x,i)=>({key:'extras', id:x.id, name:'실험 특화 '+(i+1), q:x.q, levels:GENERIC_LEVELS})));
}
function rubricHTML(exp, part){
  const r=rec(exp.id), cur=r[part];
  const items = rubricItems(exp).map(it=>{
    const v=num(cur[it.key][it.id]);
    const pv = part==='post' ? num(r.pre[it.key][it.id]) : null;
    return `<div class="item"><div class="item-h"><span class="tag">${esc(it.name)}</span>${esc(it.q)}${pv?`<span class="prev">(사전: ${pv}단계)</span>`:''}</div>
      <div class="levels">${it.levels.map((l,i)=>`<button class="lv ${v===i+1?'sel':''}" data-act="lv" data-part="${part}" data-key="${it.key}" data-id="${esc(it.id)}" data-v="${i+1}"><b>${LV_NAMES[i]}</b>${esc(l)}</button>`).join('')}</div></div>`;
  }).join('');
  const title = part==='pre' ? '실험 전 자기평가' : '실험 후 자기평가';

  return `<div class="card"><h2 style="margin-bottom:2px">${title}</h2><p class="small muted" style="margin:0 0 6px">${sub}</p>${items}</div>`;
}
function countAnswered(exp, part){
  const r=rec(exp.id)[part]; const its=rubricItems(exp);
  return [its.filter(it=>num(r[it.key][it.id])).length, its.length];
}
function measureHTML(exp, r){
  const m=r.measure, ht=exp.inputMode==='ht';
  const n = ht ? Math.max(m.h.length, m.t.length) : m.values.length;
  let rows='';
  for(let i=0;i<n;i++){
    if(ht){
      const h=num(m.h[i]), t=num(m.t[i]); const g = (h>0&&t>0)?2*h/(t*t):null;
      rows += `<tr><td>${i+1}</td><td><input type="number" step="any" data-m="h" data-i="${i}" value="${esc(m.h[i]??'')}" placeholder="m"></td><td><input type="number" step="any" data-m="t" data-i="${i}" value="${esc(m.t[i]??'')}" placeholder="s"></td><td class="num" id="g${i}">${fmt(g,3)}</td><td><button class="btn sm danger" data-act="delrow" data-i="${i}" ${n<=1?'disabled':''}>삭제</button></td></tr>`;
    } else {
      rows += `<tr><td>${i+1}</td><td><input type="number" step="any" data-m="values" data-i="${i}" value="${esc(m.values[i]??'')}" placeholder="${esc(exp.unit||'')}"></td><td><button class="btn sm danger" data-act="delrow" data-i="${i}" ${n<=1?'disabled':''}>삭제</button></td></tr>`;
    }
  }
  const head = ht ? `<tr><th>회차</th><th>낙하 높이 h (m)</th><th>낙하 시간 t (s)</th><th class="num">g = 2h/t² (m/s²)</th><th></th></tr>` : `<tr><th>회차</th><th>측정값 ${esc(exp.quantity||'')} (${esc(exp.unit||'')})</th><th></th></tr>`;
  return `<div class="card"><h2>측정 결과 입력</h2><p class="small muted" style="margin-top:-6px">${ht?'회차마다 낙하 높이와 시간을 입력하면 g가 자동으로 계산돼요.':'회차마다 측정한 값을 입력하세요.'} 표준편차를 구하려면 2회 이상, 신뢰할 만한 결과를 위해 5회 이상을 권장해요.</p>
    <div class="tablewrap"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div>
    <div style="margin-top:10px"><button class="btn sm" data-act="addrow">+ 회차 추가</button></div></div>
    <div class="card"><h3>실시간 통계</h3><div id="statsBox">${statsHTML(exp, r)}</div></div>`;
}
function statsHTML(exp, r){
  const st = stats(rowsToValues(exp, r.measure), exp.theory); const u=esc(exp.unit||'');
  if(!st.n) return `<div class="muted small">유효한 측정값을 입력하면 통계가 계산돼요.</div>`;
  const a = accScore(st.relErr, exp.tol);
  const judge = a==null ? '' : a>=3 ? `<span class="pill good">허용 오차(${exp.tol}%) 이내</span>` : `<span class="pill ${a===2?'warn':'bad'}">허용 오차(${exp.tol}%) 초과</span>`;
  return `<div class="tablewrap"><table><tbody>
    <tr><th>유효 측정 횟수 n</th><td class="num">${st.n}</td><th>이론값</th><td class="num">${exp.theory!=null?esc(exp.theory)+' '+u:'–'}</td></tr>
    <tr><th>평균</th><td class="num">${fmt(st.mean,4)} ${u}</td><th>오차율</th><td class="num">${fmt(st.relErr,2)} % ${judge}</td></tr>
    <tr><th>표준편차 (n−1)</th><td class="num">${fmt(st.sd,4)}</td><th>변동계수</th><td class="num">${fmt(st.cv,2)} %</td></tr>
    <tr><th>표준오차</th><td class="num">${fmt(st.se,4)}</td><th>95% 신뢰구간</th><td class="num">${st.ci?`${fmt(st.ci[0],3)} ~ ${fmt(st.ci[1],3)}`:'–'}</td></tr>
  </tbody></table></div>${st.inCI===false?`<div class="hint">이론값이 95% 신뢰구간 밖에 있어요. 우연 오차보다는 계통 오차(장비·방법의 치우침)가 있을 가능성이 커요.</div>`:st.inCI===true?`<div class="hint">이론값이 95% 신뢰구간 안에 있어요. 측정값과 이론값의 차이는 통계적으로 의미 있다고 보기 어려워요.</div>`:''}`;
}
function resultHTML(exp, r){
  const A = analyze(exp, r, S.cfg); const st=A.st;
  const c = A.calib ? CALIB[A.calib] : null;
  const fbs = feedback(exp, A);
  return `<div class="kpis">
    <div class="kpi"><div class="l">사전 자기평가</div><div class="v">${fmt(A.preTotal,0)}</div><div class="s">100점 환산 (가중치 반영)</div></div>
    <div class="kpi"><div class="l">사후 자기평가</div><div class="v">${fmt(A.postTotal,0)}</div><div class="s">${A.growth!=null?(A.growth>=0?'+':'')+fmt(A.growth,0)+'점 변화':''}</div></div>
    <div class="kpi"><div class="l">실제 오차율</div><div class="v">${fmt(st.relErr,1)}%</div><div class="s">${A.pred!=null?`예상 ${fmt(A.pred,1)}%`:'예상값 없음'}</div></div>
    <div class="kpi"><div class="l">메타인지 판정</div><div class="v" style="font-size:18px;margin-top:6px">${c?`<span class="pill ${c[1]}" style="font-size:14px">${c[0]}</span>`:'–'}</div><div class="s">자기평가 ${fmt(A.selfSkill,1)} vs 실제 ${A.actual??'–'} (4단계 기준)</div></div>
    <div class="kpi"><div class="l">종합 지수</div><div class="v">${fmt(A.composite,0)}</div><div class="s">자기평가 ${S.cfg.rubricRatio}% + 측정 정확도 ${100-S.cfg.rubricRatio}%</div></div>
  </div>
  <div class="grid g2"><div class="card"><h3>항목별 변화 (실험 전 vs 후)</h3><div class="chartbox"><canvas id="cRadar"></canvas></div></div>
  <div class="card"><h3>피드백</h3>${fbs.map(f=>`<div class="fb ${f[1]}">${f[0]}</div>`).join('')}</div></div>
  <div class="card"><h3>측정 통계</h3>${statsHTML(exp, r)}</div>
  <div class="row"><button class="btn" data-act="redo">자기평가 다시 하기</button></div>`;
}
function feedback(exp, A){
  const out=[]; const D=dims(exp);
  const growths = D.map(d=>({d, g:(A.post[d.id]??0)-(A.pre[d.id]??0)})).sort((a,b)=>b.g-a.g);
  if(growths[0] && growths[0].g>0) out.push([`가장 많이 성장한 항목은 <b>${esc(growths[0].d.name)}</b>이에요 (+${fmt(growths[0].g,1)}단계).`,'good']);
  const lows = D.filter(d=>A.post[d.id]!=null).sort((a,b)=>A.post[a.id]-A.post[b.id]);
  if(lows[0] && A.post[lows[0].id] < 3) out.push([`<b>${esc(lows[0].name)}</b> 항목이 아직 ${fmt(A.post[lows[0].id],1)}단계예요. 다음 실험에서 우선 보완해 보세요.`,'warn']);
  if(A.calib==='over') out.push([`측정·데이터·오차 분석 능력을 평균 ${fmt(A.selfSkill,1)}단계로 평가했지만, 실제 측정 정확도는 ${A.actual}단계 수준이에요. 측정 과정을 다시 점검해 보세요.`,'bad']);
  if(A.calib==='under') out.push([`실제 측정 정확도(${A.actual}단계)가 자기평가(${fmt(A.selfSkill,1)}단계)보다 높아요. 생각보다 잘하고 있어요.`,'warn']);
  if(A.calib==='ok') out.push([`자기평가와 실제 측정 결과가 잘 맞아요. 자기 수준을 정확하게 파악하고 있어요.`,'good']);
  if(A.predGap!=null) out.push([Math.abs(A.predGap)<=2 ? `오차율 예측이 정확했어요 (예상 ${fmt(A.pred,1)}%, 실제 ${fmt(A.st.relErr,1)}%).` : A.predGap>0 ? `실제 오차율이 예상보다 ${fmt(A.predGap,1)}%p 컸어요. 예상하지 못한 오차 요인이 있었는지 생각해 보세요.` : `실제 오차율이 예상보다 ${fmt(-A.predGap,1)}%p 작았어요.`, '']);
  if(A.st.n && A.st.n<5) out.push([`측정 횟수가 ${A.st.n}회예요. 5회 이상 측정하면 통계 결과를 더 믿을 수 있어요.`,'']);
  if(!out.length) out.push(['측정값과 자기평가를 모두 입력하면 피드백이 나와요.','']);
  return out;
}
function afterFlow(){

  updateProgress();
  if(r.step===4 && window.Chart){

/* ===================== 샘플 데이터 ===================== */
function gauss(){ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
const clampLv = x => Math.max(1, Math.min(4, Math.round(x)));
function makeSample(exp, i){
  const ability = 1.6 + Math.random()*2.2;          // 실제 실력
  const bias = (Math.random()-0.45)*1.6;             // 자기평가 치우침
  const pre={scores:{},extras:{}}, post={scores:{},extras:{}};
  CORE.forEach(c=>{ pre.scores[c.id]=clampLv(ability-0.6+bias+gauss()*0.5); post.scores[c.id]=clampLv(pre.scores[c.id]+Math.random()*1.3); });
  exp.extras.forEach(x=>{ pre.extras[x.id]=clampLv(ability-0.7+bias+gauss()*0.5); post.extras[x.id]=clampLv(pre.extras[x.id]+Math.random()*1.2); });
  const th = exp.theory || 1; const errFrac = (exp.tol/100) * (4.6-ability) * 0.55;
  const sysErr = (Math.random()<0.5?-1:1) * errFrac; const n = 4 + Math.floor(Math.random()*4);
  const vals = Array.from({length:n}, ()=> th*(1+sysErr+gauss()*errFrac*0.5));
  const measure = {values:[''],h:[''],t:['']};
  if(exp.inputMode==='ht'){ measure.h=[]; measure.t=[]; vals.forEach(g=>{ const h=+(1.0+Math.random()*0.5).toFixed(2); measure.h.push(String(h)); measure.t.push(String(+(Math.sqrt(2*h/Math.max(g,0.1))).toFixed(3))); }); }
  else measure.values = vals.map(v=>String(+v.toPrecision(5)));
  pre.predErr = String(+(Math.max(0.5, exp.tol*(0.4+Math.random()*1.4))).toFixed(1));
  post.reflection = '';
  const done = Math.random() > 0.12;
  return {name:'샘플학생 '+String(i+1).padStart(2,'0'), sid:'2026'+String(1001+i), sample:true, updatedAt:new Date().toISOString(),
    exps:{[exp.id]:{step:done?4:3, done, pre, measure, post}}};
}

document.addEventListener('click', async ev=>{
  const b = ev.target.closest('[data-act]'); if(!b || b.tagName==='SELECT') return;
  const act=b.dataset.act;
  try { await handle(act, b); } catch(e){ console.error(e); toast(errMsg(e)); }
});
async function handle(act, b){
  if(act==='view'){ S.view=b.dataset.v; if(S.view==='prof'){ try{ await API.loadResponses(); }catch(e){} } render(); return; }
  if(act==='home'){ S.expId=null; render(); window.scrollTo(0,0); return; }
  if(act==='open'){
    const my=ensureMy();
    my.name=($('#pName')?.value||'').trim(); my.sid=($('#pSid')?.value||'').trim();
    if(!my.name || !my.sid){ toast('이름과 학번을 먼저 입력해 주세요.'); return; }
    S.expId=b.dataset.id; rec(S.expId);
    await saveMy();
    render(); window.scrollTo(0,0); return;
  }
  if(act==='lv'){
    const exp=curExp(), r=rec(exp.id), part=r[b.dataset.part];
    part[b.dataset.key][b.dataset.id]=+b.dataset.v;
    b.parentElement.querySelectorAll('.lv').forEach(x=>x.classList.toggle('sel', x===b));
    updateProgress(); return;
  }
  if(act==='step'){
    if(S.saving) return;
    const exp=curExp(), r=rec(exp.id), d=+b.dataset.d;
    if(d>0){
      if(r.step===1 || r.step===3){ const [a,n]=countAnswered(exp, r.step===1?'pre':'post'); if(a<n){ toast(`아직 ${n-a}개 문항에 답하지 않았어요.`); return; } }
      if(r.step===2){ const v=rowsToValues(exp, r.measure); if(v.length<1){ toast('유효한 측정값을 1개 이상 입력해 주세요.'); return; } }
      if(r.step===3) r.done=true;
    }
    const prev=r.step; r.step=Math.max(1, Math.min(4, (r.step||1)+d));
    const ok = await saveMy();
    if(!ok && d>0){ r.step=prev; if(prev===3) r.done=false; return; }
    render(); window.scrollTo(0,0); return;
  }
  if(act==='addrow'){
    const exp=curExp(), m=rec(exp.id).measure;
    if(exp.inputMode==='ht'){ const last=m.h[m.h.length-1]||''; m.h.push(last); m.t.push(''); } else m.values.push('');
    render(); return;
  }
  if(act==='delrow'){
    const exp=curExp(), m=rec(exp.id).measure, i=+b.dataset.i;
    if(exp.inputMode==='ht'){ m.h.splice(i,1); m.t.splice(i,1); } else m.values.splice(i,1);
    render(); return;
  }
  if(act==='redo'){
    const ok = await askConfirm('사전·사후 자기평가와 측정값을 처음부터 다시 입력할까요? 지금 결과는 지워져요.', '다시 하기');
    if(!ok) return; delete S.my.exps[S.expId]; rec(S.expId); await saveMy(); render(); window.scrollTo(0,0); return;
  }
  /* 교수자 */
  if(!S.isAdmin) return;
  if(act==='ptab'){ S.ptab=b.dataset.v; S.edit=null; render(); return; }
  if(act==='refresh'){ await API.loadResponses(); render(); toast('최신 응답을 불러왔어요.'); return; }
  if(act==='csv'){
    const exp=S.exps.find(e=>e.id===S.pexp); const rows=respRows(exp); const D=dims(exp);
    const head=['학번','이름','완료',...D.map(d=>'사전_'+d.name),...D.map(d=>'사후_'+d.name),'사전총점','사후총점','측정횟수','평균','표준편차','오차율(%)','예상오차율(%)','메타인지','종합지수','성찰메모'];
    const q=v=>{ const s=String(v??''); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
    const lines=[head.map(q).join(',')].concat(rows.map(({p,r,A})=>[p.sid,p.name,r.done?'Y':'N',...D.map(d=>A.pre[d.id]!=null?fmt(A.pre[d.id],2):''),...D.map(d=>A.post[d.id]!=null?fmt(A.post[d.id],2):''),
      fmt(A.preTotal,1),fmt(A.postTotal,1),A.st.n||0,fmt(A.st.mean,4),fmt(A.st.sd,4),fmt(A.st.relErr,2),A.pred??'',A.calib?CALIB[A.calib][0]:'',fmt(A.composite,1),(r.post&&r.post.reflection)||''].map(q).join(',')));
    const text=lines.join('\n');
    try{ await navigator.clipboard.writeText(text); toast('CSV를 복사했어요. 엑셀이나 구글 시트에 붙여 넣으세요.'); }
    catch(e){ $('#modalbox').innerHTML=`<h3>CSV</h3><p class="small muted">자동 복사가 막혀 있어요. 아래 내용을 직접 복사하세요.</p><textarea style="min-height:200px">${esc(text)}</textarea><div class="navbar"><span></span><button class="btn pri" onclick="document.getElementById('modal').classList.remove('show')">닫기</button></div>`; $('#modal').classList.add('show'); }
    return;
  }
  if(act==='sample' && S.isOwner){
    const exp=S.exps.find(e=>e.id===S.pexp); if(!exp) return;
    b.disabled=true; b.textContent='생성 중…';
    for(let i=0;i<15;i++){ const id='sample-'+String(i+1).padStart(2,'0'); const old=S.resps.find(p=>p.id===id); const doc=makeSample(exp,i);
      if(old && old.exps){ const keep=clone(old); delete keep.id; keep.exps[exp.id]=doc.exps[exp.id]; await API.saveResp(id, keep); } else await API.saveResp(id, doc); }
    await API.loadResponses(); render(); toast('샘플 응답 15개를 만들었어요.'); return;
  }
  if(act==='unsample' && S.isOwner){
    if(!(await askConfirm('샘플 응답을 모두 삭제할까요? 실제 학생 응답은 그대로 남아요.'))) return;
    for(const p of S.resps.filter(p=>p.sample)) await API.delResp(p.id);
    await API.loadResponses(); render(); toast('샘플 응답을 삭제했어요.'); return;
  }
  if(act==='newexp'){ S.edit={_new:true, id:rid('exp'), name:'', desc:'', quantity:'', unit:'', theory:'', tol:5, inputMode:'value', extras:[], order:Date.now()}; render(); return; }
  if(act==='editexp'){ S.edit=clone(S.exps.find(e=>e.id===b.dataset.id)); render(); return; }
  if(act==='cancelexp'){ S.edit=null; render(); return; }
  if(act==='addx'){ S.edit.extras.push({id:rid('x'), q:''}); render(); const ins=document.querySelectorAll('[data-x]'); ins[ins.length-1]?.focus(); return; }
  if(act==='delx'){ S.edit.extras.splice(+b.dataset.i,1); render(); return; }
  if(act==='saveexp'){
    const e=clone(S.edit); const isNew=e._new; delete e._new;
    e.name=(e.name||'').trim(); if(!e.name){ toast('실험 이름을 입력해 주세요.'); return; }
    e.theory=num(e.theory); if(e.theory==null){ toast('이론값을 입력해 주세요. 오차율 계산에 필요해요.'); return; }
    e.tol=num(e.tol)||5; e.extras=e.extras.map(x=>({id:x.id, q:(x.q||'').trim()})).filter(x=>x.q);
    b.disabled=true;
    try{ await API.saveExp(e); } catch(err){ b.disabled=false; toast(errMsg(err)); return; }
    normExp(e); const i=S.exps.findIndex(x=>x.id===e.id); if(i>=0) S.exps[i]=e; else S.exps.push(e);
    S.edit=null; render(); toast(isNew?'실험을 추가했어요.':'저장했어요.'); return;
  }
  if(act==='delexp'){
    const e=S.exps.find(x=>x.id===b.dataset.id);
    if(!(await askConfirm(`"${e.name}" 실험을 삭제할까요? 학생 응답 기록은 남지만 목록과 분석에서 보이지 않게 돼요.`))) return;
    await API.delExp(e.id); S.exps=S.exps.filter(x=>x.id!==e.id); render(); toast('삭제했어요.'); return;
  }
  if(act==='resetw'){ S.cfg=mergeCfg(null); render(); return; }
  if(act==='savew'){
    document.querySelectorAll('[data-w]').forEach(inp=>{ const v=num(inp.value); if(inp.dataset.w==='rubricRatio') S.cfg.rubricRatio=Math.max(0,Math.min(100,v??70)); else S.cfg.weights[inp.dataset.w]=Math.max(0,Math.min(5,v??1)); });
    await API.saveConfig(S.cfg); render(); toast('가중치를 저장했어요.'); return;
  }
}
document.addEventListener('input', ev=>{
  const t=ev.target;
  if(t.dataset.m!=null){
    const exp=curExp(); if(!exp) return; const r=rec(exp.id); r.measure[t.dataset.m][+t.dataset.i]=t.value;
    if(exp.inputMode==='ht'){ const i=+t.dataset.i, h=num(r.measure.h[i]), tt=num(r.measure.t[i]); const c=$('#g'+i); if(c) c.textContent=fmt((h>0&&tt>0)?2*h/(tt*tt):null,3); }
    const sb=$('#statsBox'); if(sb) sb.innerHTML=statsHTML(exp, r); return;
  }
  if(t.dataset.f){ const exp=curExp(); if(!exp) return; const r=rec(exp.id); if(t.dataset.f==='predErr') r.pre.predErr=t.value; else r.post.reflection=t.value; return; }
  if(t.dataset.e && S.edit){ S.edit[t.dataset.e]=t.value; return; }
  if(t.dataset.x!=null && S.edit){ S.edit.extras[+t.dataset.x].q=t.value; return; }
});
document.addEventListener('change', ev=>{
  const t=ev.target;
  if(t.dataset.act==='pexp'){ S.pexp=t.value; render(); return; }
  if(t.dataset.e && S.edit){ S.edit[t.dataset.e]=t.value; }
  if((t.id==='pName'||t.id==='pSid')){ const my=ensureMy(); my.name=$('#pName').value.trim(); my.sid=$('#pSid').value.trim(); }
});

/* ===================== 시작 ===================== */
(async function start(){
  await API.init();
  try { await API.loadAll(); }
  catch(e){ $('#app').innerHTML=`<div class="card empty">데이터를 불러오지 못했어요. 잠시 후 페이지를 다시 열어 주세요.</div>`; renderBanner(); return; }
  render();
})();
</script>
</body>
</html>
